name: Build and release DriveLink
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: drivelink-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content DriveLink.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid project version.' }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") { throw 'Tag must match project version.' }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Verify app
        run: |
          dotnet run --project tests/DriveLink.Checks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Application checks failed.' }
      - name: Archive source and framework build
        run: ./scripts/Build-Release.ps1
      - name: Build installer and update feed
        run: ./scripts/Build-UpdateRelease.ps1
      - name: Verify real update package and corruption rejection
        run: |
          dotnet run --project tests/DriveLink.Checks.csproj -c Release -- --update-feed "artifacts/updates-v${{ steps.version.outputs.value }}"
          if ($LASTEXITCODE -ne 0) { throw 'Update package checks failed.' }
      - name: Publish public repository release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          gh release view $tag --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; bump the version instead of overwriting it.' }
          $notes = Get-Content RELEASE-NOTES.md -Raw
          $notesPath = Join-Path $env:RUNNER_TEMP 'drivelink-release-notes.md'
          $notes | Set-Content -LiteralPath $notesPath -Encoding utf8
          gh release create $tag (Get-ChildItem "artifacts/updates-v$version" -File | ForEach-Object FullName) "versions/v$version/source-v$version.zip" --repo $env:GH_REPO --target $env:RELEASE_COMMIT --title "DriveLink v$version — Quang Huy" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }

